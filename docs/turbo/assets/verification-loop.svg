<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 540" role="img" aria-labelledby="title desc"><title id="title">BenBen closes the loop with follow-up evidence</title><desc id="desc">Capture, analyse and recall, propose and review, perform a task, revisit, verify. Verification updates memory or requests a further observation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#337566"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1440" height="540" rx="0" fill="#f0f3ec" stroke="#f0f3ec"/><text x="34" y="45" font-size="14" fill="#527062" font-weight="700">FROM FINDING TO VERIFIED OUTCOME</text><rect x="35" y="90" width="420" height="155" rx="10" fill="#fff" stroke="#d8ded9"/><text x="57" y="127" font-size="26" fill="#173f35" font-weight="700">Capture</text><text x="57" y="166" font-size="16" fill="#203a3c" font-weight="400">Video · cloud · pose</text><text x="57" y="209" font-size="14" fill="#6b786c" font-weight="400">Archive first</text><rect x="510" y="90" width="420" height="155" rx="10" fill="#fff" stroke="#d8ded9"/><text x="532" y="127" font-size="26" fill="#173f35" font-weight="700">Analyse + recall</text><text x="532" y="166" font-size="16" fill="#203a3c" font-weight="400">Quality · Muse · SAM · prior evidence</text><text x="532" y="209" font-size="14" fill="#6b786c" font-weight="400">Cite exact observations</text><rect x="985" y="90" width="420" height="155" rx="10" fill="#fff" stroke="#d8ded9"/><text x="1007" y="127" font-size="26" fill="#173f35" font-weight="700">Propose + review</text><text x="1007" y="166" font-size="16" fill="#203a3c" font-weight="400">One action and its evidence</text><text x="1007" y="209" font-size="14" fill="#6b786c" font-weight="400">Operator confirms</text><rect x="985" y="325" width="420" height="155" rx="10" fill="#fff" stroke="#d8ded9"/><text x="1007" y="362" font-size="26" fill="#173f35" font-weight="700">Act + receipt</text><text x="1007" y="401" font-size="16" fill="#203a3c" font-weight="400">Local task or configured tool</text><text x="1007" y="444" font-size="14" fill="#6b786c" font-weight="400">Delivery is not resolution</text><rect x="510" y="325" width="420" height="155" rx="10" fill="#fff" stroke="#d8ded9"/><text x="532" y="362" font-size="26" fill="#173f35" font-weight="700">Revisit</text><text x="532" y="401" font-size="16" fill="#203a3c" font-weight="400">Fresh capture of the same place</text><text x="532" y="444" font-size="14" fill="#6b786c" font-weight="400">Human first; robot later</text><rect x="35" y="325" width="420" height="155" rx="10" fill="#fff" stroke="#d8ded9"/><text x="57" y="362" font-size="26" fill="#173f35" font-weight="700">Verify + remember</text><text x="57" y="401" font-size="16" fill="#203a3c" font-weight="400">Persists / cleared / inconclusive</text><text x="57" y="444" font-size="14" fill="#6b786c" font-weight="400">Review then close or reopen</text><path d="M455 167H502" fill="none" stroke="#337566" stroke-width="3" marker-end="url(#arrow)"/><path d="M930 167H978" fill="none" stroke="#337566" stroke-width="3" marker-end="url(#arrow)"/><path d="M1195 245V317" fill="none" stroke="#337566" stroke-width="3" marker-end="url(#arrow)"/><path d="M985 402H938" fill="none" stroke="#337566" stroke-width="3" marker-end="url(#arrow)"/><path d="M510 402H463" fill="none" stroke="#337566" stroke-width="3" marker-end="url(#arrow)"/><path d="M245 325V253" fill="none" stroke="#337566" stroke-width="3" marker-end="url(#arrow)"/><text x="34" y="515" font-size="16" fill="#527062" font-weight="400">Every arrow is a durable event. Every physical outcome needs new usable evidence.</text><text x="290" y="288" font-size="14" fill="#527062" font-weight="400">Evidence and state feed the next run</text></g></svg>