<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc"><title id="title">Proposed BenBen evidence workbench</title><desc id="desc">Concept with issues at left, a spatial route in the centre, selected video and answer at right, and earlier and latest evidence below. This is an interface concept, not a running product.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1440" height="860" rx="0" fill="#f7f7f1" stroke="#f7f7f1"/><text x="30" y="43" font-size="27" fill="#183e3a" font-weight="700">BenBen</text><text x="164" y="42" font-size="17" fill="#203a3c" font-weight="400">Estate route / Inspection memory</text><text x="1120" y="42" font-size="12" fill="#6a7770" font-weight="700">PROPOSED INTERFACE</text><path d="M0 66L1440 66" stroke="#b3bfba" stroke-width="2" fill="none"/><text x="24" y="104" font-size="12" fill="#68766e" font-weight="700">ACTION ITEMS</text><rect x="16" y="125" width="210" height="90" rx="10" fill="#e8efea" stroke="#d8ded9"/><text x="30" y="151" font-size="16" fill="#203a3c" font-weight="700">Step-free path</text><text x="30" y="173" font-size="11" fill="#647169" font-weight="400">Latest usable observation</text><text x="30" y="198" font-size="12" fill="#a24d32" font-weight="400">Review</text><rect x="16" y="231" width="210" height="90" rx="10" fill="#fff" stroke="#d8ded9"/><text x="30" y="257" font-size="16" fill="#203a3c" font-weight="700">Stairs without ramp</text><text x="30" y="279" font-size="11" fill="#647169" font-weight="400">Route alternative needed</text><text x="30" y="304" font-size="12" fill="#376a61" font-weight="400">Reroute</text><rect x="16" y="337" width="210" height="90" rx="10" fill="#fff" stroke="#d8ded9"/><text x="30" y="363" font-size="16" fill="#203a3c" font-weight="700">Paper bag</text><text x="30" y="385" font-size="11" fill="#647169" font-weight="400">Compare repeat sightings</text><text x="30" y="410" font-size="12" fill="#376a61" font-weight="400">Service<