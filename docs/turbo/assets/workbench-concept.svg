idth="8" stroke-linecap="round"/><path d="M610 372l55 28 -31 20 -55 -29Z" fill="#bd573a" stroke="#9a3f28"/><circle cx="620" cy="391" r="21" fill="#fff" stroke="#bd573a" stroke-width="4"/><text x="614" y="397" font-size="17" fill="#9a3f28" font-weight="700">1</text><rect x="650" y="410" width="190" height="65" rx="10" fill="#fff" stroke="#d8ded9"/><text x="665" y="437" font-size="16" fill="#203a3c" font-weight="700">Condition changed</text><text x="665" y="459" font-size="12" fill="#65766b" font-weight="400">Open linked observations</text><text x="276" y="580" font-size="12" fill="#65766b" font-weight="400">Approximate capture locations until transforms are verified</text><text x="1080" y="104" font-size="12" fill="#647169" font-weight="700">SELECTED EVIDENCE</text><rect x="1072" y="122" width="350" height="240" rx="10" fill="#213f3b" stroke="#d8ded9"/><path d="M1100 330L1214 189L1302 189L1400 330" stroke="#a8b8a7" fill="#52685c"/><path d="M1176 258h135v32h-135Z" fill="none" stroke="#e9ad83" stroke-width="3"/><text x="1090" y="148" font-size="12" fill="#eff2e9" font-weight="400">Source video + actual SAM output</text><text x="1090" y="343" font-size="11" fill="#eff2e9" font-weight="400">Recorded  •  observation time  •  source ID</text><rect x="1072" y="378" width="350" height="90" rx="10" fill="#fff" stroke="#d8ded9"/><text x="1088" y="406" font-size="17" fill="#203a3c" font-weight="700">Is the route still blocked?</text><text x="1088" y="431" font-size="13" fill="#203a3c" font-weight="400">Compare two usable observations.</text><text x="1088" y="451" font-size="12" fill="#237664" font-weight="400">[Earlier evidence]  [Latest evidence]</text><rect x="1072" y="485" width="350" height="123" rx="10" fill="#fff" stroke="#d8ded9"/><text x="1088" y="513" font-size="11" fill="#647169" font-weight="700">NEXT ACTION</text><text x="1088" y="542" font-size="17" fill="#203a3c" font-weight="700">Review service task</text><text x="1088" y="568" font-size="12" fill="#203a3c" font-